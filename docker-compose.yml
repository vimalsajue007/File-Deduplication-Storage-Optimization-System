name: dedupe

x-backend-env: &backend-env
  env_file: .env
  environment:
    # Always point the containers at the compose services, whatever .env says
    MYSQL_HOST: mysql
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    LOG_DIR: /app/logs

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"   # for MySQL Workbench (host 127.0.0.1, port 3307)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - uploads_data:/data/uploads
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # Swagger UI: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      backend: { condition: service_healthy }   # backend applies the migrations first
    volumes:
      - uploads_data:/data/uploads
      - worker_logs:/app/logs

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  backend_logs:
  worker_logs:
